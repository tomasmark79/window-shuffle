<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
     width="512"
     height="512"
     viewBox="0 0 512 512"
     role="img"
     aria-labelledby="title description">
  <title id="title">Window Shuffle</title>
  <desc id="description">Four white rounded squares with soft shadows</desc>

  <defs>
    <filter id="tile-shadow"
            x="-25%"
            y="-25%"
            width="150%"
            height="165%"
            color-interpolation-filters="sRGB">
      <feGaussianBlur in="SourceAlpha" stdDeviation="10" result="blur"/>
      <feOffset in="blur" dx="0" dy="10" result="offset-blur"/>
      <feFlood flood-color="#000000" flood-opacity="0.38" result="shadow-color"/>
      <feComposite in="shadow-color"
                   in2="offset-blur"
                   operator="in"
                   result="shadow"/>
      <feMerge>
        <feMergeNode in="shadow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <g fill="#ffffff" filter="url(#tile-shadow)">
    <rect x="56" y="56" width="168" height="168" rx="30"/>
    <rect x="288" y="56" width="168" height="168" rx="30"/>
    <rect x="56" y="288" width="168" height="168" rx="30"/>
    <rect x="288" y="288" width="168" height="168" rx="30"/>
  </g>
</svg>
